<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>plaza</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#7c4dff">
  <link rel="stylesheet" href="style.css">
  <script src="xlogin.js"></script>
</head>
<body>

  <!-- Pod rail: pods the user has visited. Hardcoded shells for now. -->
  <aside class="rail">
    <div class="rail-pod active" id="brand-mark" title="this pod">▣</div>
    <div class="rail-divider"></div>
    <div class="rail-add" title="Visit another pod (coming soon)">+</div>
  </aside>

  <!-- Channel sidebar -->
  <aside class="sidebar">
    <div class="sb-header">
      <div class="sb-pod-name">
        <span class="status-dot" id="ws-status" title="connecting…"></span>
        <span id="brand-name">plaza</span>
      </div>
      <div class="sb-pod-host" id="sub">group chat on the open web</div>
    </div>

    <div class="sb-section">
      <div class="sb-section-title">Channels</div>
      <ul class="sb-list">
        <li class="sb-item active"><span class="glyph">#</span>general</li>
      </ul>
    </div>

    <div class="sb-foot">
      <button class="topbar-id" id="topbar-id" type="button">Log in</button>
    </div>
  </aside>

  <!-- Main: channel header + messages + composer -->
  <main class="main">
    <header class="ch-header">
      <div class="ch-title"><span class="glyph">#</span>general</div>
      <div class="ch-topic" id="room-host">Town square for this pod · anyone with read access can follow</div>
      <div class="ch-actions">
        <span class="ch-members"><span aria-hidden="true">👥</span> <span id="room-count">0</span></span>
        <button class="ch-action ch-action-extra" title="Pinned">📌</button>
        <button class="ch-action ch-action-extra" title="Files">📎</button>
        <input class="ch-search" type="search" placeholder="Search messages…">
        <button class="room-toggle" id="room-toggle" hidden title="Toggle whether logged-in users from any pod can post here">Chat: …</button>
        <button class="topbar-id topbar-id-mobile" id="topbar-id-mobile" type="button">Log in</button>
      </div>
    </header>

    <section class="thread" id="thread">
      <div class="thread-empty" id="thread-empty">
        <div class="thread-empty-inner">
          <strong id="empty-title">Welcome to plaza.</strong>
          <p id="empty-body">This is the group chat for this pod. Anyone who can read here will see messages; logged-in users can post.</p>
        </div>
      </div>
      <ol class="messages" id="messages"></ol>
    </section>

    <section class="composer" id="composer">
      <textarea
        id="composer-input"
        class="composer-input"
        placeholder="Write something…"
        rows="1"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <button class="composer-send" id="composer-send" title="Send (Enter)" disabled>Send</button>
    </section>
  </main>

  <div class="toast" id="toast" hidden>
    <span class="toast-msg" id="toast-msg"></span>
    <button class="toast-close" id="toast-close" title="Dismiss">×</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
